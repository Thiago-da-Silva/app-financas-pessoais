# Blueprint do Render: site estático gratuito (sem "hibernação").
services:
  - type: web
    name: controle-financeiro
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      # SPA: todas as rotas caem no index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # arquivos com hash no nome: podem ficar em cache para sempre
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # página principal: sem cache, para a versão nova aparecer logo após o deploy
      # (o padrão do Render guarda o HTML por até 5 minutos na CDN)
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
