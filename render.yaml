# Blueprint do Render: site estático gratuito (sem "hibernação").
services:
  - type: web
    name: controle-financeiro
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: false
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: NODE_VERSION
        value: "22"
    routes:
      # SPA: todas as rotas caem no index.html
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      # arquivos com hash no nome: podem ficar em cache para sempre
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # página principal: sem cache, para a versão nova aparecer logo após o deploy
      # (o padrão do Render guarda o HTML por até 5 minutos na CDN)
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache

      # ---- Cabeçalhos de segurança (todas as páginas) ----
      # CSP: de onde o site pode carregar scripts/estilos/fontes/imagens e para onde
      # pode enviar dados. Se mudar o projeto do Supabase, atualize o endereço abaixo.
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self';
          script-src 'self';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' https://fonts.gstatic.com;
          img-src 'self' data: blob: https://zrpwuhaiilryyztjyzhw.supabase.co;
          connect-src 'self' https://zrpwuhaiilryyztjyzhw.supabase.co wss://zrpwuhaiilryyztjyzhw.supabase.co;
          frame-ancestors 'none';
          base-uri 'self';
          form-action 'self';
          object-src 'none'
      # impede que o site seja aberto dentro de outro site (clickjacking)
      - path: /*
        name: X-Frame-Options
        value: DENY
      # links externos não recebem o endereço completo da página
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # desliga recursos do navegador que o app não usa
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
