# O plano gratuito do Supabase pausa projetos sem atividade por 7 dias.
# Este workflow faz uma consulta leve a cada 3 dias para manter o projeto ativo.
# Configure os secrets SUPABASE_URL e SUPABASE_ANON_KEY no repositório do GitHub.
name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta leve na API
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/categories?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "HTTP $status"
          test "$status" -lt 500
